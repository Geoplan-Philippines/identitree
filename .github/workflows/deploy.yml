name: "DEPLOY IDENTITREE"

on:
  push:
    branches: ["main", "staging"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          if [[ $GITHUB_REF == 'refs/heads/main' ]]; then
            echo "TAG=prod" >> $GITHUB_ENV
            echo "API_URL=https://identitree-api.geoplanph.com/api/v1" >> $GITHUB_ENV
            echo "DEPLOY_PATH=docker-apps/identitree/prod" >> $GITHUB_ENV
          elif [[ $GITHUB_REF == 'refs/heads/staging' ]]; then
            echo "TAG=stg" >> $GITHUB_ENV
            echo "API_URL=https://identitree-stg-api.geoplanph.com/api/v1" >> $GITHUB_ENV
            echo "DEPLOY_PATH=docker-apps/identitree/stg" >> $GITHUB_ENV
          else
            echo "TAG=dev" >> $GITHUB_ENV
            echo "API_URL=https://identitree-dev-api.geoplanph.com/api/v1" >> $GITHUB_ENV
            echo "DEPLOY_PATH=docker-apps/identitree/dev" >> $GITHUB_ENV
          fi

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push API
        run: |
          docker build -t geoplanoperation/identitree-api:${{ env.TAG }} -f apps/api/Dockerfile .
          docker push geoplanoperation/identitree-api:${{ env.TAG }}

      - name: Build and Push Web
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL=${{ env.API_URL }} \
            -t geoplanoperation/identitree-web:${{ env.TAG }} \
            -f apps/web/Dockerfile .
          docker push geoplanoperation/identitree-web:${{ env.TAG }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/${{ secrets.VPS_USERNAME }}/${{ env.DEPLOY_PATH }}
            echo "[MESSAGE] Preparing images for ${{ env.TAG }}...."

            # These variables can be used inside your docker-compose.yml on the VPS
            export API_IMAGE="geoplanoperation/identitree-api:${{ env.TAG }}"
            export WEB_IMAGE="geoplanoperation/identitree-web:${{ env.TAG }}"

            echo "[MESSAGE] Pulling latest images..."
            docker compose pull

            echo "[MESSAGE] Deploying services..."
            docker compose up -d --force-recreate api web

            echo "[MESSAGE] Cleaning up old images..."
            docker image prune -f

            echo "[MESSAGE] Deployment completed!"
